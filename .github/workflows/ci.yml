# S17 — CI: the same three gates a local dev runs, so the standards enforce
# themselves. No org secrets here — unit + harness are green with no .env by
# design (e2e specs self-skip).
#
# 4.3: the record project is no longer run here. It only ever executed
# env-gated CLIs that skipped to green; the four specs left in tests/record/
# all need a human at the keyboard or a deliberate GEN_FIXTURE=1, so CI has
# nothing to run there. Those CLIs are now `sfpw`, covered by
# tests/unit/sfpw.spec.ts in the unit project.
name: ci

on:
  push:
    # Both names deliberately: this repo's default branch is master, while
    # main is the convention much tooling assumes. Listing both means a
    # rename never silently kills CI (it already did once — five commits
    # landed with zero workflow runs because this said [main] alone).
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=unit --project=harness
        env:
          CI: 'true'
